[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opx-directionality"
version = "0.1.0"
description = "Post-open directionality engine for selected tickers"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
  "pandas>=2.0",
  "tomli>=2.0; python_version < '3.11'",
  "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
  "pylint>=3.2",
  "pytest>=8.0",
]

[project.scripts]
opx-directionality = "opx.fetcher:main"
opx-viewer = "opx.viewer:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.main]
py-version = "3.9"

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "too-few-public-methods",
  "duplicate-code",
]

[tool.pylint.design]
max-args = 8
